name: iOS Files fixed input-route comparison

on:
  push:
    branches: ['codex/ios-idb-route-comparison']

permissions:
  contents: read
  actions: read

jobs:
  compatibility:
    name: Verify the pinned Indigo companion with zero input
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RAISING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      RAISING_IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: arm64
      - name: Prepare exact disposable companion dependencies
        run: bash .github/diagnostics/ios-idb/setup.sh
      - name: Verify the exact toolchain and no-input capability
        env:
          RAISING_IOS_CONTACT_ROUTE: preflight
        run: |
          RAISING_IDB_VALIDATE_PROTOBUF=1 "$RAISING_IDB_PYTHON" scripts/lib/ios-idb-contact.test.py
          bash .github/diagnostics/ios-idb/record-toolchain.sh
          node scripts/test-ios-idb-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idb-no-input-capability
          path: |
            .cache/ios-simulator-ci/*environment.txt
            .cache/ios-simulator-ci/idb-dependencies.txt
            .cache/ios-idb-preflight/
          include-hidden-files: true
          retention-days: 14

  pair-a-b:
    needs: compatibility
    uses: ./.github/workflows/ios-idb-diagnostic-pair.yml
    with:
      order: a-b

  pair-b-a:
    needs: [compatibility, pair-a-b]
    if: ${{ !cancelled() && needs.compatibility.result == 'success' && needs.pair-a-b.outputs.compatible == 'true' }}
    uses: ./.github/workflows/ios-idb-diagnostic-pair.yml
    with:
      order: b-a
