name: iOS export and Simulator Files
on:
  push:
    paths: &ios-paths
      - '.github/workflows/ios-simulator.yml'
      - 'apps/qt-studio/**'
      - 'assets/**'
      - 'config/native-dependencies.json'
      - 'examples/my-first-raising-game/**'
      - 'native/**'
      - 'package*.json'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/ios-system-ui/**'
      - 'tests/mobile/ios-simulator-test.test.mjs'
  pull_request:
    paths: *ios-paths
  workflow_dispatch:
    inputs:
      run_voiceover:
        description: Run the actual VoiceOver test on the Xcode 27 hosted Simulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-public-starter:
    name: Build the public iOS export and VoiceOver harness
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      BUILD_JOBS: '3'
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_NATIVE_TRANSPORT: process
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Record source and Simulator toolchain
        shell: bash
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          mkdir -p .cache/ios-simulator-ci
          {
            echo "source=$(git rev-parse HEAD)"
            xcodebuild -version
            xcrun simctl list runtimes available
          } | tee .cache/ios-simulator-ci/environment.txt
      - run: node --test tests/mobile/ios-simulator-test.test.mjs
      - run: npm ci
      - run: npm run build:headless
      - run: npm run build:player
      - name: Export the public starter through the project service
        run: |
          node --input-type=module <<'JS'
          import path from 'node:path';
          import {cp} from 'node:fs/promises';
          import {QtStudioService} from './apps/qt-studio/service.mjs';

          const root = path.resolve('.cache/ios-simulator-ci/starter');
          const destination = path.resolve('.cache/ios-simulator-ci/export');
          await cp('examples/my-first-raising-game', root, {recursive:true});
          const service = new QtStudioService();
          try {
            await service.handle({method:'open', params:{root}});
            const {exported} = await service.handle({method:'export', params:{
              revision:service.editor.revision, target:'ios', destination,
            }});
            if (!exported.xcodeProject || exported.warning) throw Error(exported.warning ?? 'Xcode project missing');
          } finally {
            await service.editor.close();
          }
          JS
      - name: Build the exported iOS application
        run: npm run build:ios -- --project .cache/ios-simulator-ci/export
      - name: Compile the VoiceOver XCTest harness without starting a Simulator
        run: |
          node scripts/test-ios-voiceover.mjs \
            .cache/ios-simulator-ci/export/build-iphonesimulator/native-player/Release-iphonesimulator/RaisingPlayer.app \
            --build-only
      - name: Archive the exact public Simulator app for Files testing
        shell: bash
        run: |
          transfer=.cache/ios-simulator-ci/transfer
          bundle=.cache/ios-simulator-ci/export/build-iphonesimulator/native-player/Release-iphonesimulator
          app="$bundle/RaisingPlayer.app"
          mkdir -p "$transfer"
          test "$(plutil -extract MinimumOSVersion raw "$app/Info.plist")" = 16.0
          git rev-parse HEAD > "$transfer/source.txt"
          shasum -a 256 "$app/RaisingPlayer" "$app/game/game.json" > "$transfer/bundle.sha256"
          tar -cf "$transfer/starter-app.tar" -C "$bundle" RaisingPlayer.app
          (cd "$transfer" && shasum -a 256 source.txt bundle.sha256 starter-app.tar > transfer.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: public-starter-ios-simulator-app
          path: |
            .cache/ios-simulator-ci/transfer/source.txt
            .cache/ios-simulator-ci/transfer/bundle.sha256
            .cache/ios-simulator-ci/transfer/starter-app.tar
            .cache/ios-simulator-ci/transfer/transfer.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Run actual VoiceOver focus and speech on iPhone Simulator
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_voiceover }}
        env:
          RAISING_IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17e
          RAISING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
        run: |
          node scripts/test-ios-voiceover.mjs \
            .cache/ios-simulator-ci/export/build-iphonesimulator/native-player/Release-iphonesimulator/RaisingPlayer.app \
            .cache/ios-voiceover-execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-starter-ios-build-and-voiceover-evidence
          path: |
            .cache/ios-simulator-ci/environment.txt
            .cache/ios-simulator-ci/export/ios-build.json
            .cache/ios-simulator-ci/export/xcode-*.log
            .cache/ios-voiceover/run-*/result.json
            .cache/ios-voiceover/run-*/*.log
            .cache/ios-voiceover-execution/run-*/result.json
            .cache/ios-voiceover-execution/run-*/*.log
            .cache/ios-voiceover-execution/run-*/*.xcresult
          include-hidden-files: true
          retention-days: 14

  public-starter-files:
    name: Test the actual Files picker on iOS 26 Simulator
    needs: build-public-starter
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17e
      RAISING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: public-starter-ios-simulator-app
          path: .cache/ios-simulator-ci/transfer
      - name: Verify source and unpack the exact exported app
        shell: bash
        run: |
          transfer=.cache/ios-simulator-ci/transfer
          bundle=.cache/ios-simulator-ci/export/build-iphonesimulator/native-player/Release-iphonesimulator
          (cd "$transfer" && shasum -a 256 -c transfer.sha256)
          test "$(git rev-parse HEAD)" = "$(cat "$transfer/source.txt")"
          mkdir -p "$bundle"
          tar -xf "$transfer/starter-app.tar" -C "$bundle"
          shasum -a 256 -c "$transfer/bundle.sha256"
      - name: Record the Files test toolchain
        shell: bash
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          {
            echo "source=$(git rev-parse HEAD)"
            echo "testRuntime=$RAISING_IOS_SIMULATOR_RUNTIME"
            echo "testDeviceType=$RAISING_IOS_SIMULATOR_DEVICE_TYPE"
            xcodebuild -version
            xcrun simctl list runtimes available
          } | tee .cache/ios-simulator-ci/files-environment.txt
      - run: npm ci
      - name: Build the project service used by the public Files fixture
        run: |
          node scripts/generate-types.mjs
          npx --no-install tsc -p tsconfig.json
          node scripts/copy-schemas.mjs
      - name: Test export and import through the actual Files picker
        env:
          RAISING_IOS_CAPTURE_TOUCH_LOG: '1'
        shell: bash
        run: |
          test -z "${SDL_EVENT_LOGGING+x}${SIMCTL_CHILD_SDL_EVENT_LOGGING+x}"
          test -z "${RAISING_INPUT_TRACE+x}${SIMCTL_CHILD_RAISING_INPUT_TRACE+x}"
          node scripts/test-ios-system-ui.mjs .cache/ios-simulator-ci/export \
            --project examples/my-first-raising-game --family iphone --test files-roundtrip --text-scale 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-starter-ios-files-evidence
          path: |
            .cache/ios-simulator-ci/files-environment.txt
            .cache/ios-simulator-ci/transfer/*.txt
            .cache/ios-simulator-ci/transfer/*.sha256
            .cache/ios-system-ui/latest.json
            .cache/ios-system-ui/run-*/result.json
            .cache/ios-system-ui/run-*/files-export-checkpoint.json
            .cache/ios-system-ui/run-*/*-staging.json
            .cache/ios-system-ui/run-*/*.log
            .cache/ios-system-ui/run-*/*.stdout
            .cache/ios-system-ui/run-*/*.stderr
            .cache/ios-system-ui/run-*/*.xcresult
          include-hidden-files: true
          retention-days: 14
