name: Observe pinned iOS companion startup without input

on:
  push:
    branches: ['codex/ios-idb-startup-observation']

permissions:
  contents: read

jobs:
  startup-observation:
    if: ${{ github.repository == 'miandbits/RaisingEngine' && github.run_attempt == 1 }}
    name: Observe the exact owned-device companion startup
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RAISING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      RAISING_IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: arm64
      - name: Prepare exact disposable companion dependencies
        run: bash .github/diagnostics/ios-idb/setup.sh
      - name: Observe startup with the original socket deadline
        env:
          RAISING_IOS_CONTACT_ROUTE: startup
        run: |
          RAISING_IDB_VALIDATE_PROTOBUF=1 "$RAISING_IDB_PYTHON" scripts/lib/ios-idb-contact.test.py
          bash .github/diagnostics/ios-idb/record-toolchain.sh
          shasum -a 256 .github/workflows/ios-simulator.yml .github/diagnostics/ios-idb/setup.sh \
            scripts/test-ios-idb-startup.mjs scripts/lib/ios-idb-startup-observer.mjs scripts/lib/ios-idb-contact-test.mjs \
            > .cache/ios-simulator-ci/startup-observation-sources.sha256
          node scripts/test-ios-idb-startup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idb-startup-observation-no-input
          path: |
            .cache/ios-simulator-ci/*environment.txt
            .cache/ios-simulator-ci/idb-dependencies.txt
            .cache/ios-simulator-ci/startup-observation-sources.sha256
            .cache/ios-idb-startup/
          include-hidden-files: true
          retention-days: 14
