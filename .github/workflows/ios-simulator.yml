name: iOS Files prepared host contact diagnostic
on:
  push:
    branches: ['codex/ios-files-host-contact']

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-host-contact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-starter-files:
    name: Test the actual Files picker on iOS 26 Simulator
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17e
      RAISING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13933842580'
          merge-multiple: true
          path: .cache/ios-simulator-ci/transfer
          run-id: '43195821937'
          github-token: ${{ github.token }}
      - name: Verify the reused producer and unchanged app and XCTest inputs
        shell: bash
        run: |
          transfer=.cache/ios-simulator-ci/transfer
          bundle=.cache/ios-simulator-ci/export/build-iphonesimulator/native-player/Release-iphonesimulator
          producer=043b0227f3a7ca9c3f070356f1a152323cfaa5a4
          (cd "$transfer" && shasum -a 256 -c transfer.sha256)
          test "$producer" = "$(cat "$transfer/source.txt")"
          test "$(shasum -a 256 "$transfer/starter-app.tar" | cut -d ' ' -f 1)" = 413213214b7f118df7f2c3bf9f95de6381c62598e9617b5686e6811022361b81
          git fetch --no-tags --depth=1 origin "$producer"
          git diff --name-status "$producer" HEAD | tee .cache/ios-simulator-ci/source-diff.txt
          git diff --exit-code "$producer" HEAD -- . \
            ':(exclude).github/workflows/ios-simulator.yml' \
            ':(exclude)scripts/lib/ios-simulator-host-contact.swift' \
            ':(exclude)scripts/test-ios-system-ui.mjs'
          test "$(shasum -a 256 tests/ios-system-ui/SystemUITests.swift | cut -d ' ' -f 1)" = 0b1dd60cd34f8205da0250788d7c81ffd5fd563eb098dd00a92282af0017995a
          mkdir -p "$bundle"
          tar -xf "$transfer/starter-app.tar" -C "$bundle"
          shasum -a 256 -c "$transfer/bundle.sha256"
          test "$(shasum -a 256 "$bundle/RaisingPlayer.app/RaisingPlayer" | cut -d ' ' -f 1)" = dca7c40216dcaff7cb21cb2fb79bdb53b129b26dadcdafe3dea1fd990903941a
      - name: Record the Files test toolchain
        shell: bash
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          {
            echo "consumerSource=$(git rev-parse HEAD)"
            echo "producerSource=$(cat .cache/ios-simulator-ci/transfer/source.txt)"
            echo "producerRun=43195821937"
            echo "producerArtifact=13933842580"
            echo "testRuntime=$RAISING_IOS_SIMULATOR_RUNTIME"
            echo "testDeviceType=$RAISING_IOS_SIMULATOR_DEVICE_TYPE"
            xcodebuild -version
            xcodebuild -version -sdk iphonesimulator
            xcrun simctl list runtimes available
          } | tee .cache/ios-simulator-ci/files-environment.txt
      - run: node --test tests/mobile/ios-simulator-test.test.mjs tests/mobile/ios-host-contact-test.test.mjs
      - run: npm ci
      - name: Build the project service used by the public Files fixture
        run: |
          node scripts/generate-types.mjs
          npx --no-install tsc -p tsconfig.json
          node scripts/copy-schemas.mjs
      - name: Compile the host contact diagnostic
        run: |
          base=.cache/ios-simulator-ci
          xcrun --sdk macosx swiftc -module-cache-path "$base/swift-module-cache" \
            scripts/lib/ios-simulator-host-contact.swift -o "$base/host-contact"
          shasum -a 256 native/player/main.cpp native/player/simulator-input-proof.hpp \
            scripts/lib/ios-simulator-host-contact.swift scripts/lib/ios-host-contact-test.mjs \
            scripts/test-ios-system-ui.mjs tests/ios-system-ui/SystemUITests.swift \
            "$base/host-contact" > "$base/host-contact-sources.sha256"
      - name: Test export and import through the actual Files picker
        env:
          RAISING_IOS_CAPTURE_TOUCH_LOG: '1'
        run: |
          test -z "${SDL_EVENT_LOGGING+x}${SIMCTL_CHILD_SDL_EVENT_LOGGING+x}"
          test -z "${RAISING_INPUT_TRACE+x}${SIMCTL_CHILD_RAISING_INPUT_TRACE+x}"
          export RAISING_IOS_HOST_CONTACT_TOOL="$PWD/.cache/ios-simulator-ci/host-contact"
          node scripts/test-ios-system-ui.mjs .cache/ios-simulator-ci/export \
            --project examples/my-first-raising-game --family iphone --test files-roundtrip --text-scale 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-starter-ios-files-evidence
          path: |
            .cache/ios-simulator-ci/files-environment.txt
            .cache/ios-simulator-ci/source-diff.txt
            .cache/ios-simulator-ci/host-contact-sources.sha256
            .cache/ios-simulator-ci/transfer/*.txt
            .cache/ios-simulator-ci/transfer/*.sha256
            .cache/ios-system-ui/latest.json
            .cache/ios-system-ui/run-*/result.json
            .cache/ios-system-ui/run-*/files-export-checkpoint.json
            .cache/ios-system-ui/run-*/host-contact-preboot-inventory.json
            .cache/ios-system-ui/run-*/host-contact-*/*.json
            .cache/ios-system-ui/run-*/*-staging.json
            .cache/ios-system-ui/run-*/*.log
            .cache/ios-system-ui/run-*/*.stdout
            .cache/ios-system-ui/run-*/*.stderr
            .cache/ios-system-ui/run-*/*.xcresult
          include-hidden-files: true
          retention-days: 14
