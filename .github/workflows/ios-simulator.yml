name: iOS Simulator GUI attachment diagnostic
on:
  push:
    branches: ['codex/ios-files-gui-attachment']

permissions:
  contents: read
  actions: read

jobs:
  public-starter-files:
    name: Test the actual Files picker with the owned Simulator GUI attached
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17e
      RAISING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13921698495'
          merge-multiple: true
          path: .cache/ios-simulator-ci/transfer
          run-id: '43169693181'
          github-token: ${{ github.token }}
      - name: Verify the reused producer, app and unchanged build inputs
        shell: bash
        run: |
          transfer=.cache/ios-simulator-ci/transfer
          bundle=.cache/ios-simulator-ci/export/build-iphonesimulator/native-player/Release-iphonesimulator
          (cd "$transfer" && shasum -a 256 -c transfer.sha256)
          producer=bac26f4971912e62fbab3129f57aaa37c32babe3
          test "$producer" = "$(cat "$transfer/source.txt")"
          test "$(shasum -a 256 "$transfer/starter-app.tar" | cut -d ' ' -f 1)" = 3432427976004804cc521c2a58e140ace35e6a1c52975ce9ec71f470dd78cf62
          git fetch --no-tags --depth=1 origin "$producer"
          git diff --name-status "$producer" HEAD | tee .cache/ios-simulator-ci/source-diff.txt
          git diff --exit-code "$producer" HEAD -- . \
            ':(exclude).github/workflows/ios-simulator.yml' \
            ':(exclude)scripts/lib/ios-simulator-gui-attachment.swift' \
            ':(exclude)scripts/test-ios-system-ui.mjs' \
            ':(exclude)tests/ios-system-ui/SystemUITests.swift'
          test "$(shasum -a 256 tests/ios-system-ui/SystemUITests.swift | cut -d ' ' -f 1)" = 01a0e6362e02eb1b922a75138305119d6a933fdcb44cca6dba88f9ac1510a2b2
          mkdir -p "$bundle"
          tar -xf "$transfer/starter-app.tar" -C "$bundle"
          shasum -a 256 -c "$transfer/bundle.sha256"
          test "$(shasum -a 256 "$bundle/RaisingPlayer.app/RaisingPlayer" | cut -d ' ' -f 1)" = dd0e2f434420fca16728e0dfb4da58396400e38d5cebdb97429b37af8493d35f
      - name: Record the Files test toolchain
        shell: bash
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          {
            echo "consumerSource=$(git rev-parse HEAD)"
            echo "producerSource=$(cat .cache/ios-simulator-ci/transfer/source.txt)"
            echo "producerRun=43169693181"
            echo "producerArtifact=13921698495"
            echo "testRuntime=$RAISING_IOS_SIMULATOR_RUNTIME"
            echo "testDeviceType=$RAISING_IOS_SIMULATOR_DEVICE_TYPE"
            xcodebuild -version
            xcodebuild -version -sdk iphonesimulator
            xcrun simctl list runtimes available
          } | tee .cache/ios-simulator-ci/files-environment.txt
      - run: npm ci
      - name: Build the project service used by the public Files fixture
        run: |
          node scripts/generate-types.mjs
          npx --no-install tsc -p tsconfig.json
          node scripts/copy-schemas.mjs
      - name: Compile the Simulator GUI attachment probe
        shell: bash
        run: |
          shasum -a 256 scripts/lib/ios-simulator-gui-attachment.swift | tee -a .cache/ios-simulator-ci/files-environment.txt
          xcrun --sdk macosx swiftc scripts/lib/ios-simulator-gui-attachment.swift \
            -module-cache-path .cache/ios-simulator-ci/swift-module-cache \
            -o .cache/ios-simulator-ci/gui-attachment
      - name: Test export and import through the actual Files picker
        env:
          RAISING_IOS_CAPTURE_TOUCH_LOG: '1'
        shell: bash
        run: |
          test -z "${SDL_EVENT_LOGGING+x}${SIMCTL_CHILD_SDL_EVENT_LOGGING+x}"
          test -z "${RAISING_INPUT_TRACE+x}${SIMCTL_CHILD_RAISING_INPUT_TRACE+x}"
          export RAISING_IOS_GUI_ATTACHMENT_TOOL="$PWD/.cache/ios-simulator-ci/gui-attachment"
          node scripts/test-ios-system-ui.mjs .cache/ios-simulator-ci/export \
            --project examples/my-first-raising-game --family iphone --test files-roundtrip --text-scale 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-starter-ios-files-evidence
          path: |
            .cache/ios-simulator-ci/files-environment.txt
            .cache/ios-simulator-ci/source-diff.txt
            .cache/ios-simulator-ci/transfer/*.txt
            .cache/ios-simulator-ci/transfer/*.sha256
            .cache/ios-system-ui/latest.json
            .cache/ios-system-ui/run-*/result.json
            .cache/ios-system-ui/run-*/simulator-gui-attachment*.json
            .cache/ios-system-ui/run-*/simulator-gui-attachment*.png
            .cache/ios-system-ui/run-*/files-export-checkpoint.json
            .cache/ios-system-ui/run-*/*-staging.json
            .cache/ios-system-ui/run-*/*.log
            .cache/ios-system-ui/run-*/*.stdout
            .cache/ios-system-ui/run-*/*.stderr
            .cache/ios-system-ui/run-*/*.xcresult
          include-hidden-files: true
          retention-days: 14
