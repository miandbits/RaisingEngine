name: Original XCTest UIKit SDL engine isolation
on:
  push:
    branches: ['codex/ios-vendor-isolation']

permissions:
  contents: read

jobs:
  build-fixtures:
    if: ${{ github.repository == 'miandbits/RaisingEngine' && github.run_attempt == 1 }}
    name: Build exact UIKit SDL and engine comparison apps
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      BUILD_JOBS: '3'
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_NATIVE_TRANSPORT: process
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Record exact producer source and toolchain
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          mkdir -p .cache/ios-vendor-ci
          {
            git rev-parse HEAD 'HEAD^{tree}'
            xcodebuild -version
            xcodebuild -version -sdk iphonesimulator
          } | tee .cache/ios-vendor-ci/producer-environment.txt
          grep -Fx 'Xcode 27.2' .cache/ios-vendor-ci/producer-environment.txt
          grep -Fx 'Build version 27B52' .cache/ios-vendor-ci/producer-environment.txt
      - run: npm ci
      - run: npm run build:headless
      - run: npm run build:player
      - name: Export the public starter through the project service
        run: |
          node --input-type=module <<'JS'
          import path from 'node:path';
          import {cp} from 'node:fs/promises';
          import {QtStudioService} from './apps/qt-studio/service.mjs';

          const root = path.resolve('.cache/ios-vendor-ci/starter');
          const destination = path.resolve('.cache/ios-vendor-ci/export');
          await cp('examples/my-first-raising-game', root, {recursive:true});
          const service = new QtStudioService();
          try {
            await service.handle({method:'open', params:{root}});
            const {exported} = await service.handle({method:'export', params:{
              revision:service.editor.revision, target:'ios', destination,
            }});
            if (!exported.xcodeProject || exported.warning) throw Error(exported.warning ?? 'Xcode project missing');
          } finally {
            await service.editor.close();
          }
          JS
      - name: Build and bind all three fixtures to the same source
        run: |
          npm run build:ios -- --project .cache/ios-vendor-ci/export
          bash .github/diagnostics/ios-vendor-ci/build-reference-apps.sh
      - uses: actions/upload-artifact@v4
        with:
          name: exact-vendor-fixture-apps
          path: .cache/ios-vendor-ci/transfer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-producer-evidence
          path: |
            .cache/ios-vendor-ci/producer-*.txt
            .cache/ios-vendor-ci/sdl-build-options.txt
            .cache/ios-vendor-ci/reference-*.log
            .cache/ios-vendor-ci/export/ios-build.json
            .cache/ios-vendor-ci/export/xcode-*.log
          include-hidden-files: true
          retention-days: 14

  fixed-triplets:
    needs: build-fixtures
    if: ${{ github.repository == 'miandbits/RaisingEngine' && github.run_attempt == 1 }}
    name: Original XCTest contacts ${{ matrix.order }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        order: [U-S-E, E-S-U]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17e
      RAISING_IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: exact-vendor-fixture-apps
          path: .cache/ios-vendor-ci/transfer
      - name: Verify every app from the same producer source
        run: |
          base=.cache/ios-vendor-ci
          transfer="$base/transfer"
          (cd "$transfer" && shasum -a 256 -c transfer.sha256)
          test "$(git rev-parse HEAD)" = "$(cat "$transfer/source.txt")"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(cat "$transfer/tree.txt")"
          shasum -a 256 -c "$transfer/sources.sha256"
          tar -tvf "$transfer/apps.tar" > "$base/app-archive-members.txt"
          tar -xf "$transfer/apps.tar" -C "$base"
          (cd "$base" && shasum -a 256 -c transfer/apps.sha256)
      - name: Record exact consumer toolchain
        run: bash .github/diagnostics/ios-vendor-ci/record-toolchain.sh
      - run: node --test tests/mobile/ios-simulator-test.test.mjs tests/mobile/ios-vendor-observation.test.mjs
      - run: npm ci
      - name: Build the project service used by the public Files fixture
        run: |
          node scripts/generate-types.mjs
          npx --no-install tsc -p tsconfig.json
          node scripts/copy-schemas.mjs
      - name: Run each predeclared arm once on a fresh owned device
        env:
          VENDOR_ORDER: ${{ matrix.order }}
        run: |
          test -z "${SDL_EVENT_LOGGING+x}${SIMCTL_CHILD_SDL_EVENT_LOGGING+x}"
          test -z "${RAISING_INPUT_TRACE+x}${SIMCTL_CHILD_RAISING_INPUT_TRACE+x}"
          test -z "${RAISING_IOS_HOST_CONTACT_TOOL+x}${RAISING_IOS_CONTACT_ROUTE+x}"
          node scripts/test-ios-vendor-pair.mjs "$VENDOR_ORDER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-contact-evidence-${{ matrix.order }}
          path: |
            .cache/ios-vendor-ci/files-environment.txt
            .cache/ios-vendor-ci/app-archive-members.txt
            .cache/ios-vendor-ci/transfer/*.txt
            .cache/ios-vendor-ci/transfer/*.sha256
            .cache/ios-vendor-ci/runs/*/triplet.json
            .cache/ios-vendor-ci/runs/*/arm-*/*/result.json
            .cache/ios-vendor-ci/runs/*/arm-*/*/files-export-checkpoint.json
            .cache/ios-vendor-ci/runs/*/arm-*/*/*-staging.json
            .cache/ios-vendor-ci/runs/*/arm-*/*/*.log
            .cache/ios-vendor-ci/runs/*/arm-*/*/*.stdout
            .cache/ios-vendor-ci/runs/*/arm-*/*/*.stderr
            .cache/ios-vendor-ci/runs/*/arm-*/*/*.xcresult
          include-hidden-files: true
          retention-days: 14
