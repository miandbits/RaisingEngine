name: WinGet preview lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare official WinGet client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $client = Join-Path $env:RUNNER_TEMP 'official-winget-client'
          gh release download v1.29.380 --repo microsoft/winget-cli --pattern Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle --pattern DesktopAppInstaller_Dependencies.zip --dir $client
          if ($LASTEXITCODE -ne 0) { throw 'Official WinGet download failed' }
          Expand-Archive -LiteralPath "$client/DesktopAppInstaller_Dependencies.zip" -DestinationPath "$client/dependencies"
          $dependencies = @(Get-ChildItem "$client/dependencies" -Recurse -File | Where-Object { $_.FullName -match '[\\/]x64[\\/]' -and $_.Extension -in '.appx','.msix' } | ForEach-Object FullName)
          if (!$dependencies.Count) { throw 'Official x64 WinGet dependencies missing' }
          Add-AppxPackage -Path "$client/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -DependencyPath $dependencies
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet unavailable' }
      - name: Validate, install, launch and uninstall
        shell: pwsh
        run: ./scripts/test-winget-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winget-preview-evidence
          path: .cache/winget-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
