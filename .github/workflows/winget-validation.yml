name: WinGet preview lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare official WinGet client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-Module -Name Microsoft.WinGet.Client -Scope CurrentUser -Force -Repository PSGallery
            Import-Module Microsoft.WinGet.Client
            Repair-WinGetPackageManager -Force -Latest
          }
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet unavailable' }
      - name: Validate, install, launch and uninstall
        shell: pwsh
        run: ./scripts/test-winget-package.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winget-preview-evidence
          path: .cache/winget-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
