name: Windows Chromium command-line control
on:
  push:
    branches:
      - codex/windows-chromium-commandline-check
permissions:
  contents: read
concurrency:
  group: creator-windows-commandline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-chromium-commandline:
    if: ${{ github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Verify the source and Playwright pin
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          $tree = git rev-parse 'HEAD^{tree}'
          if ($head -ne $env:GITHUB_SHA) { throw 'Unexpected validation checkout' }
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json
          $version = $lock.packages.'node_modules/playwright'.version
          $coreVersion = $lock.packages.'node_modules/playwright-core'.version
          if ($version -ne '1.64.0' -or $coreVersion -ne '1.64.0') { throw 'Unexpected Playwright lockfile pin' }
          Write-Output "Source $head; tree $tree; Playwright $version"
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - name: Verify the bundled Chromium launch and retained test controls
        env:
          RAISING_VERIFY_WINDOWS_SCREENSHOT_BROWSER: '1'
        run: node --test tests/helpers/chromium-screenshot.test.mjs
