name: Windows route batch deadline evidence
on:
  push:
    branches: ['codex/windows-route-deadline-diagnostic']

permissions:
  contents: read

jobs:
  windows-route-deadline:
    if: ${{ github.repository == 'miandbits/RaisingEngine' && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_NATIVE_TRANSPORT: process
      BUILD_JOBS: '3'
      PLAYWRIGHT_CHANNEL: chromium
      RAISING_BROWSER_CHANNEL: chromium
      QT_COMPILER: C:/Qt/Tools/mingw1310_64/bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Record exact source and runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/route-deadline-diagnostic | Out-Null
          @{
            commit = git rev-parse HEAD
            tree = git rev-parse 'HEAD^{tree}'
            testSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath tests/qt-studio/goal-route-batches.test.mjs).Hash.ToLowerInvariant()
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            node = node --version
          } | ConvertTo-Json > .cache/route-deadline-diagnostic/source.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the same MinGW compiler as the normal Windows job
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir C:/Qt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          'C:/Qt/Tools/mingw1310_64/bin' >> $env:GITHUB_PATH
      - run: npm ci
      - run: npm run build:headless
      - name: Run the unchanged route batch expectations with retained failure detail
        shell: pwsh
        run: |
          node --test --test-concurrency=1 tests/qt-studio/goal-route-batches.test.mjs |
            Tee-Object -FilePath .cache/route-deadline-diagnostic/route-batches.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-route-deadline-evidence
          path: |
            .cache/route-deadline-diagnostic/source.json
            .cache/route-deadline-diagnostic/route-batches.log
            .cache/route-deadline-diagnostic/batch-report.json
          include-hidden-files: true
          retention-days: 14
