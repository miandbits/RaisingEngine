name: Creator journey
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: creator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  creator-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      RAISING_NATIVE_TRANSPORT: process
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run build:headless
      - run: npm run test:creator-smoke
      - run: npm run benchmark:creator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-service-evidence
          path: |
            .cache/creator-smoke/
            .cache/native-portable-host/
            .cache/native-schedule-details/
            .cache/native-control-sizing/
            .cache/save-slots-layout/
            .cache/readable-web/
            .cache/native-phase-forecast/
            .cache/native-phase-forecast-layouts/
            .cache/phase-forecast-web/
            .cache/native-layout-diagnostics/
            .cache/qt-layout-diagnostics/
            .cache/qt-surface-authoring/
            .cache/growth-summary/
            .cache/readable-screen-activation/
            .cache/ui-surfaces/
            .cache/activity-result-copy/
            .cache/scroll-groups/
            .cache/ui-control-colors/
            .cache/control-colors/
            .cache/schedule-details-web/
            .cache/control-sizing-web/
            .cache/native-resume-context/
            .cache/resume-context-web/
            .cache/qt-resume-context-acceptance.json
            .cache/resume-context-*.png
            .cache/analysis-priorities-qt.png
            .cache/analysis-priority-editor-*.png
            .cache/creator-benchmark/latest.json
          include-hidden-files: true
          retention-days: 14
  windows-package:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_CHANNEL: chromium
      RAISING_BROWSER_CHANNEL: chromium
      RAISING_NATIVE_TRANSPORT: process
      BUILD_JOBS: '3'
      QT_ROOT: C:/Qt/6.10.1/mingw_64
      QT_COMPILER: C:/Qt/Tools/mingw1310_64/bin
      QT_BUILD_TARGETS: RaisingStudioQt,qt-canvas-state-test,qt-first-game-test,qt-studio-test,qt-story-flow-dialog-test,qt-validation-location-test,qt-editor-language-test,qt-readable-layout-test,qt-update-compatibility-test,qt-analysis-priorities-test,qt-resume-context-test,qt-route-batches-test,qt-editor-interaction-test,qt-layout-diagnostics-test,qt-surface-authoring-test,qt-creator-workflow-test,qt-release-settings-test,qt-analysis-periods-test,qt-presentation-update-test,qt-activity-board-test,qt-growth-authoring-test,qt-raising-screen-flow-test,qt-shared-section-test,qt-timeline-batch-test,qt-activity-workflow-test,qt-release-center-test
      QT_PACKAGE_OUT: release/qt-ci/RaisingStudio
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve the Windows preview candidate name
        shell: pwsh
        run: |
          $candidate = Get-Content config/preview-candidate.json -Raw | ConvertFrom-Json
          "QT_INSTALLER_OUT=release/qt-ci/RaisingEngine-$($candidate.version)-windows-x64.exe" >> $env:GITHUB_ENV
          "QT_PORTABLE_ARCHIVE=release/qt-ci/RaisingEngine-$($candidate.version)-windows-x64-portable.zip" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Check portable Simulator harness utilities
        run: node --test tests/mobile/ios-simulator-test.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install matching Qt and MinGW toolchain
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.10.1 win64_mingw --outputdir C:/Qt --modules qtimageformats
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir C:/Qt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Preserve toolchain diagnostics without marking the source tree dirty.
          if (Test-Path aqtinstall.log) {
            New-Item -ItemType Directory -Force .cache/build-provenance | Out-Null
            Move-Item aqtinstall.log .cache/build-provenance/aqtinstall.log
          }
          'C:/Qt/Tools/mingw1310_64/bin' >> $env:GITHUB_PATH
          'C:/Qt/6.10.1/mingw_64/bin' >> $env:GITHUB_PATH
          "NINJA=$((Get-Command ninja).Source.Replace('\','/'))" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run build:headless
      - run: npm run build:player
      - run: npm run build:studio
      - name: Install the pinned Web compiler
        shell: pwsh
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .cache/emsdk
          git -C .cache/emsdk checkout 35ff8a6d150541276abbc6bae512ca90bcfbe220
          python .cache/emsdk/emsdk.py install 6.0.12
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python .cache/emsdk/emsdk.py activate 6.0.12
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "EMSDK=$env:GITHUB_WORKSPACE/.cache/emsdk" >> $env:GITHUB_ENV
      - run: npm run build:web
      - run: npx playwright install chromium
      - name: Package the current source with verified Qt sources
        run: |
          npm run prepare:qt-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/capture-build-provenance.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package:qt-studio
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/audit-preview-package.mjs
      - name: Test the packaged starter without developer tools on PATH
        run: node scripts/test-windows-first-game-package.mjs "$env:QT_PACKAGE_OUT"
      - name: Build the Windows installer
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NSIS_COMPILER = 'C:/Program Files (x86)/NSIS/makensis.exe'
          node scripts/build-qt-installer.mjs
      - name: Archive the audited Windows payload
        run: node scripts/package-preview-artifacts.mjs
      - name: Record Windows package environment and installer signature
        id: windows-signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:QT_INSTALLER_OUT
          if ($signature.Status.ToString() -ne 'NotSigned') { throw 'Unexpected installer signature status' }
          $os = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          @{
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            product = $os.ProductName
            build = $os.CurrentBuildNumber
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            authenticodeStatus = $signature.Status.ToString()
          } | ConvertTo-Json > .cache/build-provenance/windows-environment.json
      - name: Run the Korean pilot from the exact portable ZIP
        shell: pwsh
        env:
          RAISING_TEST_UI_LANGUAGE: ko
        run: |
          $manifest = Get-Content release/qt-ci/release-artifacts.json -Raw | ConvertFrom-Json
          $head = git rev-parse HEAD
          $tree = git rev-parse 'HEAD^{tree}'
          if ($manifest.sourceCommit -ne $head -or $manifest.sourceTree -ne $tree -or $manifest.sourceTreeDirty -ne $false) {
            throw 'Windows candidate does not identify the clean checked-out source'
          }
          $zip = Get-Item -LiteralPath $env:QT_PORTABLE_ARCHIVE
          $pin = $manifest.files | Where-Object { $_.file -ceq $zip.Name }
          if ($zip.Length -ne $pin.bytes -or (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash -ne $pin.sha256) {
            throw 'Portable ZIP hash mismatch'
          }
          $unpacked = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'preview-portable')
          tar.exe -xf $zip.FullName -C $unpacked.FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:QT_PACKAGE_OUT = Join-Path $unpacked.FullName RaisingStudio
          $bundleManifest = Join-Path $env:QT_PACKAGE_OUT package-manifest.json
          if ((Get-FileHash -LiteralPath $bundleManifest -Algorithm SHA256).Hash -ne $manifest.packageManifestSha256) {
            throw 'Portable ZIP does not contain the audited package manifest'
          }
          node scripts/test-qt-package.mjs --portable --creator-pilot
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item .cache/qt-release/latest.json .cache/qt-release/portable-ko.json
      - name: Run the English installed pilot beside the published preview and verify safe uninstall
        if: ${{ !cancelled() && steps.windows-signature.conclusion == 'success' }}
        env:
          RAISING_TEST_UI_LANGUAGE: en
        run: node scripts/test-windows-preview-upgrade.mjs
      - name: Test the creator journey on Windows
        # npm.ps1 can consume the argument separator in PowerShell.
        run: node scripts/smoke-creator.mjs --web --desktop
      - name: Check Chromium screenshot helper controls
        env:
          RAISING_VERIFY_WINDOWS_SCREENSHOT_BROWSER: '0'
        run: node --test tests/helpers/chromium-screenshot.test.mjs
      - name: Publish Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-creator-evidence
          path: |
            .cache/build-provenance/
            .cache/creator-smoke/
            .cache/route-deadline-diagnostic/batch-report.json
            .cache/native-portable-host/
            .cache/native-schedule-details/
            .cache/native-control-sizing/
            .cache/save-slots-layout/
            .cache/readable-web/
            .cache/native-phase-forecast/
            .cache/native-phase-forecast-layouts/
            .cache/phase-forecast-web/
            .cache/native-layout-diagnostics/
            .cache/qt-layout-diagnostics/
            .cache/qt-surface-authoring/
            .cache/growth-summary/
            .cache/activity-board/
            .cache/readable-screen-activation/
            .cache/ui-surfaces/
            .cache/activity-result-copy/
            .cache/scroll-groups/
            .cache/ui-control-colors/
            .cache/control-colors/
            .cache/schedule-details-web/
            .cache/control-sizing-web/
            .cache/native-resume-context/
            .cache/resume-context-web/
            .cache/qt-resume-context-acceptance.json
            .cache/resume-context-*.png
            .cache/analysis-priorities-qt.png
            .cache/analysis-priority-editor-*.png
            .cache/first-game-ui/latest.json
            .cache/first-game-ui/run-*/ui.txt
            .cache/first-game-ui/run-*/startup.txt
            .cache/first-game-ui/run-*/checklist.png
            .cache/first-game-native/latest.json
            .cache/first-game-web/latest.json
            .cache/first-game-web/run-*/result.json
            .cache/first-game-web/run-*/*.png
            .cache/windows-first-game-package/result.json
            .cache/qt-release/latest.json
            .cache/qt-release/portable-ko.json
            .cache/qt-release/run-*/evidence/*.json
            .cache/qt-release/run-*/evidence/*.txt
            .cache/qt-release/run-*/evidence/*.png
            .cache/windows-preview-upgrade/run-*/result.json
            .cache/preview-release/package-audit.json
            release/qt-ci/RaisingStudio/package-manifest.json
            release/qt-ci/*.exe.json
          include-hidden-files: true
          retention-days: 14
      - name: Upload tested Windows candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-candidate
          path: |
            release/qt-ci/RaisingEngine-*-windows-x64.exe
            release/qt-ci/RaisingEngine-*-windows-x64-portable.zip
            release/qt-ci/SHA256SUMS.txt
            release/qt-ci/release-artifacts.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  macos-package:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_CHANNEL: chromium
      RAISING_BROWSER_CHANNEL: chromium
      BUILD_JOBS: '3'
      QT_BUILD_TARGETS: RaisingStudioQt,qt-canvas-state-test,qt-first-game-test,qt-studio-test,qt-story-flow-dialog-test,qt-validation-location-test,qt-readable-layout-test,qt-update-compatibility-test,qt-analysis-priorities-test,qt-resume-context-test,qt-route-batches-test,qt-editor-interaction-test,qt-layout-diagnostics-test,qt-surface-authoring-test,qt-creator-workflow-test,qt-release-settings-test,qt-analysis-periods-test,qt-presentation-update-test,qt-activity-board-test,qt-growth-authoring-test,qt-raising-screen-flow-test,qt-shared-section-test,qt-timeline-batch-test,qt-activity-workflow-test,qt-release-center-test
      MACOS_STUDIO_OUT: dist/macos/RaisingStudio.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: brew install qt cmake ninja
      - run: npm ci
      - run: npm run build:headless
      - run: npm run build:player
      - run: npm run build:studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the pinned Web compiler
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .cache/emsdk
          git -C .cache/emsdk checkout 35ff8a6d150541276abbc6bae512ca90bcfbe220
          .cache/emsdk/emsdk install 6.0.12
          .cache/emsdk/emsdk activate 6.0.12
      - name: Build Web player
        run: EMSDK="$PWD/.cache/emsdk" npm run build:web
      - run: npx playwright install chromium
      - name: Package and test the actual bundled services
        shell: bash
        run: |
          export MACOS_NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          node scripts/capture-build-provenance.mjs
          npm run package:macos -- --candidate
          for source in native/player/{CMakeLists.txt,main.cpp,ios-accessibility.hpp,ios-accessibility.mm,portable-save-files-ios.mm,screen.hpp}; do
            cmp "$source" "$MACOS_STUDIO_OUT/Contents/Resources/engine/$source"
            shasum -a 256 "$source"
          done | tee .cache/build-provenance/macos-ios-source.sha256
          npm run test:creator-smoke -- --web --desktop --package "$MACOS_STUDIO_OUT"
          npm run benchmark:creator
      - name: Verify the macOS archive and record its provenance
        shell: bash
        run: |
          version=$(node -p "require('./config/preview-candidate.json').version")
          mkdir -p release/macos-preview
          archive="$PWD/release/macos-preview/RaisingStudio-$version-macOS-arm64.zip"
          /usr/bin/ditto -c -k --keepParent "$MACOS_STUDIO_OUT" "$archive"
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          /usr/bin/ditto -x -k "$archive" "$extracted"
          candidate="$extracted/RaisingStudio.app"
          /usr/bin/codesign --verify --deep --strict "$candidate"
          cp "$candidate/Contents/Resources/package-manifest.json" .cache/build-provenance/macos-package-manifest.json
          /usr/bin/codesign --display --verbose=4 "$candidate" > .cache/build-provenance/macos-signature.txt 2>&1
          (cd release/macos-preview && shasum -a 256 "$(basename "$archive")") > .cache/build-provenance/macos-archive.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-creator-evidence
          path: |
            .cache/build-provenance/
            .cache/creator-smoke/
            .cache/native-portable-host/
            .cache/native-schedule-details/
            .cache/native-control-sizing/
            .cache/save-slots-layout/
            .cache/readable-web/
            .cache/native-phase-forecast/
            .cache/native-phase-forecast-layouts/
            .cache/phase-forecast-web/
            .cache/native-layout-diagnostics/
            .cache/qt-layout-diagnostics/
            .cache/qt-surface-authoring/
            .cache/growth-summary/
            .cache/activity-board/
            .cache/readable-screen-activation/
            .cache/ui-surfaces/
            .cache/activity-result-copy/
            .cache/scroll-groups/
            .cache/ui-control-colors/
            .cache/control-colors/
            .cache/schedule-details-web/
            .cache/control-sizing-web/
            .cache/native-resume-context/
            .cache/resume-context-web/
            .cache/qt-resume-context-acceptance.json
            .cache/resume-context-*.png
            .cache/analysis-priorities-qt.png
            .cache/analysis-priority-editor-*.png
            .cache/first-game-ui/latest.json
            .cache/first-game-ui/run-*/ui.txt
            .cache/first-game-ui/run-*/startup.txt
            .cache/first-game-ui/run-*/checklist.png
            .cache/first-game-web/latest.json
            .cache/first-game-web/run-*/result.json
            .cache/first-game-web/run-*/*.png
            .cache/first-game-native/latest.json
            .cache/first-game-package/run-*/result.json
            .cache/creator-benchmark/latest.json
          include-hidden-files: true
          retention-days: 14
